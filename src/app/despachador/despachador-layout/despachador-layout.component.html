<div class="shell" [class.collapsed]="collapsed">
  <app-nav-escritorio
    class="desktop-only"
    [secciones]="secciones"
    base="/despachador"
    [colapsado]="collapsed"
    (alternar)="toggleCollapse()"
    (salir)="logout()"
  ></app-nav-escritorio>

  <main class="content">
    <app-barra-superior
      class="desktop-only"
      [secciones]="secciones"
      base="/despachador"
      [puedeCambiarRol]="cr.disponible"
      (cambiarRol)="cr.abrir()"
    ></app-barra-superior>
    <router-outlet></router-outlet>
  </main>

  <!-- Celular -->
  <nav class="pill-nav mobile-only" aria-label="Secciones">
    <a routerLink="/despachador" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="avisos.cerrar()">
      <ion-icon name="home-outline"></ion-icon>
      <span class="tab-label">Inicio</span>
    </a>
    <a routerLink="/despachador/pedidos" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="avisos.cerrar()">
      <ion-icon name="receipt-outline"></ion-icon>
      <span class="tab-label">Pedidos</span>
    </a>
    <div class="pill-center">
      <a routerLink="/despachador/pedidos/nuevo" class="pill-action" (click)="avisos.cerrar()">
        <ion-icon name="add"></ion-icon>
        <span class="tab-label">Nuevo</span>
      </a>
    </div>
    <a routerLink="/despachador/cuadres" routerLinkActive="active" (click)="avisos.cerrar()">
      <ion-icon name="wallet-outline"></ion-icon>
      <span class="tab-label">Cuadres</span>
    </a>
    <a routerLink="/despachador/tu" routerLinkActive="active" class="tab-perfil" (click)="avisos.cerrar()" aria-label="Tú: tu perfil, todas las páginas y más opciones">
      <span class="icono-badge">
        <app-avatar [nombre]="supabase.perfil()?.nombre" [url]="supabase.perfil()?.avatar_url" [size]="24"></app-avatar>
        <span class="badge-num num" *ngIf="avisos.noLeidas()" [attr.aria-label]="avisos.noLeidas() + ' avisos sin leer'">{{ avisos.noLeidas() > 9 ? '9+' : avisos.noLeidas() }}</span>
      </span>
      <span class="tab-label">Tú</span>
    </a>
  </nav>


  <app-avisos-panel posicion="sidebar"></app-avisos-panel>
  <app-aviso-inactividad></app-aviso-inactividad>
  <app-cambio-rol #cr></app-cambio-rol>
</div>
