<div class="shell" [class.collapsed]="collapsed">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">V</span>
      <span class="brand-name" *ngIf="!collapsed">Variedades JYB</span>
    </div>

    <button class="collapse-btn" (click)="toggleCollapse()" aria-label="Contraer menú">
      <ion-icon [name]="collapsed ? 'chevron-forward-outline' : 'chevron-back-outline'"></ion-icon>
    </button>

    <nav class="menu">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/admin' }"
        class="menu-item"
      >
        <ion-icon [name]="item.icon"></ion-icon>
        <span *ngIf="!collapsed">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="footer-btn" (click)="toggleTheme()">
        <ion-icon [name]="theme.isDark() ? 'sunny-outline' : 'moon-outline'"></ion-icon>
        <span *ngIf="!collapsed">{{ theme.isDark() ? 'Modo claro' : 'Modo oscuro' }}</span>
      </button>
      <button class="footer-btn" (click)="logout()">
        <ion-icon name="log-out-outline"></ion-icon>
        <span *ngIf="!collapsed">Salir</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <nav class="pill-nav mobile-only">
    <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <ion-icon name="home-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <a routerLink="/admin/pedidos" routerLinkActive="active">
      <ion-icon name="receipt-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <a routerLink="/admin/cuadres" routerLinkActive="active" class="pill-action">
      <ion-icon name="wallet-outline"></ion-icon>
    </a>

    <div class="pill-center">
      <a routerLink="/admin/pedidos/nuevo" class="pill-action">
        <ion-icon name="add"></ion-icon>
      </a>
    </div>

    <a routerLink="/admin/productos" routerLinkActive="active">
      <ion-icon name="cube-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <a routerLink="/admin/usuarios" routerLinkActive="active">
      <ion-icon name="people-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <a routerLink="/admin/reportes" routerLinkActive="active">
      <ion-icon name="bar-chart-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <a routerLink="/admin/configuracion" routerLinkActive="active">
      <ion-icon name="settings-outline"></ion-icon>
      <span class="dot"></span>
    </a>
    <button class="pill-action" (click)="logout()">
      <ion-icon name="log-out-outline"></ion-icon>
    </button>
  </nav>
</div>
