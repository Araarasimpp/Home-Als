<div class="layout">
  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <nav class="pill-nav" aria-label="Secciones">
    <a routerLink="/domiciliario" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="avisos.cerrar()">
      <ion-icon name="home-outline"></ion-icon>
      <span class="tab-label">Mi ruta</span>
    </a>
    <a routerLink="/domiciliario/cuadres" routerLinkActive="active" (click)="avisos.cerrar()">
      <ion-icon name="wallet-outline"></ion-icon>
      <span class="tab-label">Cuadre</span>
    </a>
    <button class="tab" [class.active]="avisos.abierto()" (click)="avisos.toggle()" [attr.aria-expanded]="avisos.abierto()">
      <span class="icono-badge">
        <ion-icon name="notifications-outline"></ion-icon>
        <span class="badge-num num" *ngIf="avisos.noLeidas()">{{ avisos.noLeidas() > 9 ? '9+' : avisos.noLeidas() }}</span>
      </span>
      <span class="tab-label">Avisos</span>
    </button>
    <button class="pill-action" *ngIf="cr.disponible" (click)="avisos.cerrar(); cr.abrir()">
      <ion-icon name="swap-horizontal-outline"></ion-icon>
      <span class="tab-label">Rol</span>
    </button>
    <a routerLink="/domiciliario/perfil" routerLinkActive="active" class="tab-perfil" (click)="avisos.cerrar()" aria-label="Mi perfil">
      <app-avatar [nombre]="supabase.perfil()?.nombre" [url]="supabase.perfil()?.avatar_url" [size]="24"></app-avatar>
      <span class="tab-label">Perfil</span>
    </a>
  </nav>

  <app-avisos-panel posicion="barra"></app-avisos-panel>
  <app-cambio-rol #cr></app-cambio-rol>
</div>
