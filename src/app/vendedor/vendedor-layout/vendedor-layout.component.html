<div class="layout">
  <main class="content">
    <router-outlet></router-outlet>
  </main>

  <nav class="pill-nav" aria-label="Secciones">
    <a routerLink="/vendedor" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="avisos.cerrar()">
      <ion-icon name="home-outline"></ion-icon>
      <span class="tab-label">Inicio</span>
    </a>
    <a routerLink="/vendedor/venta-local" routerLinkActive="active" (click)="avisos.cerrar()">
      <ion-icon name="storefront-outline"></ion-icon>
      <span class="tab-label">Local</span>
    </a>
    <div class="pill-center">
      <a routerLink="/vendedor/nuevo-pedido" class="pill-action" (click)="avisos.cerrar()">
        <ion-icon name="add"></ion-icon>
        <span class="tab-label">Nuevo pedido</span>
      </a>
    </div>
    <a routerLink="/vendedor/pagos" routerLinkActive="active" (click)="avisos.cerrar()">
      <ion-icon name="card-outline"></ion-icon>
      <span class="tab-label">Pagos</span>
    </a>
    <a routerLink="/vendedor/tu" routerLinkActive="active" class="tab-perfil" (click)="avisos.cerrar()" aria-label="Tú: tu perfil, todas las páginas y más opciones">
      <span class="icono-badge">
        <app-avatar [nombre]="supabase.perfil()?.nombre" [url]="supabase.perfil()?.avatar_url" [size]="24"></app-avatar>
        <span class="badge-num num" *ngIf="avisos.noLeidas()" [attr.aria-label]="avisos.noLeidas() + ' avisos sin leer'">{{ avisos.noLeidas() > 9 ? '9+' : avisos.noLeidas() }}</span>
      </span>
      <span class="tab-label">Tú</span>
    </a>
  </nav>

  <app-avisos-panel posicion="barra"></app-avisos-panel>
</div>
