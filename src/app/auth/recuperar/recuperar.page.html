<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <img class="brand-mark" src="assets/icon/logo.png" alt="Home ALS" />
      <div>
        <h1>Recupera tu contraseña</h1>
        <p>Te enviamos un enlace para crear una nueva.</p>
      </div>
    </div>

    <ng-container *ngIf="!enviado; else listo">
      <form class="auth-form" (ngSubmit)="onEnviar()">
        <div class="field">
          <label for="email">Correo de tu cuenta</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            inputmode="email"
            autocapitalize="off"
            spellcheck="false"
            [(ngModel)]="email"
            placeholder="nombre@correo.com"
          />
        </div>
        <p class="error-msg" role="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
        <button type="submit" class="submit-btn" [disabled]="loading">
          {{ loading ? 'Enviando…' : 'Enviar enlace' }}
        </button>
      </form>
    </ng-container>

    <ng-template #listo>
      <p class="ok-msg" role="status">
        Si <strong>{{ email.trim() }}</strong> tiene una cuenta, en unos minutos te llega un correo con el enlace.
        Revisa también la carpeta de spam. El enlace vence en una hora.
      </p>
      <button class="submit-btn submit-secundario" (click)="enviado = false">Usar otro correo</button>
    </ng-template>

    <p class="switch-link"><a routerLink="/auth/login">Volver a iniciar sesión</a></p>
  </div>
</div>
