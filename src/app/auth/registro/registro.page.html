<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <img class="brand-mark" src="assets/icon/logo.png" alt="Home ALS" />
      <div>
        <h1>Crea tu cuenta</h1>
        <p>Entras como vendedor. El administrador puede cambiar tu rol después.</p>
      </div>
    </div>

    <form class="auth-form" (ngSubmit)="onRegistrar()">
      <div class="field">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" name="nombre" type="text" autocomplete="name" [(ngModel)]="nombre" />
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          [(ngModel)]="email"
          placeholder="nombre@correo.com"
        />
      </div>

      <div class="field">
        <label for="telefono">Teléfono</label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          autocomplete="tel"
          inputmode="tel"
          [(ngModel)]="telefono"
          placeholder="300 123 4567"
        />
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">Contraseña</label>
          <span class="hint">Mínimo 6 caracteres</span>
        </div>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            [type]="verClave ? 'text' : 'password'"
            autocomplete="new-password"
            [(ngModel)]="password"
          />
          <button type="button" class="reveal-btn" (click)="verClave = !verClave">
            {{ verClave ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <p class="error-msg" role="alert" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
  </div>
</div>
