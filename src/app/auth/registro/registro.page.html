<div class="auth-shell">
  <div class="auth-card auth-card-ancha">
    <div class="auth-head">
      <img class="brand-mark" src="assets/icon/logo.png" alt="Home ALS" />
      <div>
        <h1>Crea tu cuenta</h1>
        <p>Entras como vendedor. El administrador puede cambiar tu rol después.</p>
      </div>
    </div>

    <form class="auth-form form-registro" (ngSubmit)="onRegistrar()">
      <div class="field col-completa">
        <label for="nombre">Nombre completo</label>
        <input
          id="nombre"
          name="nombre"
          type="text"
          autocomplete="name"
          [(ngModel)]="nombre"
          (ngModelChange)="actualizarEvaluacion()"
          [attr.aria-invalid]="intentoEnviar && !nombre.trim()"
        />
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          autocapitalize="off"
          spellcheck="false"
          [(ngModel)]="email"
          (ngModelChange)="actualizarEvaluacion()"
          placeholder="nombre@correo.com"
          [attr.aria-invalid]="intentoEnviar && !email.trim()"
        />
      </div>

      <div class="field">
        <label for="telefono">Teléfono <span class="hint">(opcional)</span></label>
        <input
          id="telefono"
          name="telefono"
          type="tel"
          autocomplete="tel"
          inputmode="tel"
          [(ngModel)]="telefono"
          placeholder="300 123 4567"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            [type]="verClave ? 'text' : 'password'"
            autocomplete="new-password"
            [(ngModel)]="password"
            (ngModelChange)="actualizarEvaluacion()"
            [attr.aria-invalid]="intentoEnviar && !evaluacion.valida"
            aria-describedby="medidor-clave"
          />
          <button
            type="button"
            class="reveal-btn"
            (click)="verClave = !verClave"
            [attr.aria-pressed]="verClave"
            [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ verClave ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmar">Repite la contraseña</label>
        <input
          id="confirmar"
          name="confirmar"
          [type]="verClave ? 'text' : 'password'"
          autocomplete="new-password"
          [(ngModel)]="confirmar"
          [attr.aria-invalid]="noCoinciden || (intentoEnviar && !confirmar)"
        />
      </div>

      <div class="col-completa medidor-wrap">
        <app-medidor-clave id="medidor-clave" [evaluacion]="evaluacion"></app-medidor-clave>
        <p class="field-error" *ngIf="noCoinciden">Las dos contraseñas no coinciden.</p>
      </div>

      <p class="error-msg col-completa" role="alert" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" class="submit-btn col-completa" [disabled]="loading">
        {{ loading ? 'Revisando…' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
  </div>
</div>
