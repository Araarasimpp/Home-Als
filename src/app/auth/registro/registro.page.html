<div class="auth-shell">
  <section class="auth-panel-left">
    <p class="brand-tag">VARIEDADES JYB</p>
    <h1 class="auth-headline">Empieza a organizar tu inventario hoy</h1>
    <p class="auth-subhead">Crea tu cuenta y comienza a vender en minutos.</p>

    <svg class="crate-mark" viewBox="0 0 120 120" fill="none">
      <rect x="10" y="40" width="70" height="70" stroke="#E8A33D" stroke-width="2" />
      <rect x="30" y="20" width="70" height="70" stroke="#E8A33D" stroke-width="2" />
    </svg>

    <svg class="wave-divider" viewBox="0 0 90 800" preserveAspectRatio="none">
      <path
        d="M0,0 Q90,50 0,100 Q-90,150 0,200 Q90,250 0,300 Q-90,350 0,400
           Q90,450 0,500 Q-90,550 0,600 Q90,650 0,700 Q-90,750 0,800
           L90,800 L90,0 Z"
        fill="var(--k-ink)"
      />
    </svg>
  </section>

  <section class="auth-panel-right">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1><span class="accent">VARIEDADES JYB</span> · Crear cuenta</h1>
      </div>

      <div class="field">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text" [(ngModel)]="nombre" placeholder="Tu nombre completo" />
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" [(ngModel)]="email" placeholder="correo@ejemplo.com" />
      </div>

      <div class="field">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel" [(ngModel)]="telefono" placeholder="300 123 4567" />
      </div>

      <div class="field">
        <label for="telefono">Teléfono (opcional)</label>
        <input id="telefono" type="tel" [(ngModel)]="telefono" placeholder="300 123 4567" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" placeholder="Mínimo 6 caracteres" />
      </div>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button class="submit-btn" (click)="onRegistrar()" [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

      <p class="switch-link">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
    </div>
  </section>
</div>
