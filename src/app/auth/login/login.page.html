<div class="auth-shell">
  <section class="auth-panel-left">
    <p class="brand-tag">VARIEDADES JYB</p>
    <h1 class="auth-headline">Tu inventario, siempre bajo control</h1>
    <p class="auth-subhead">Ventas, pedidos y entregas en un solo lugar.</p>

    <svg class="crate-mark" viewBox="0 0 120 120" fill="none">
      <rect x="10" y="40" width="70" height="70" stroke="#E8A33D" stroke-width="2" />
      <rect x="30" y="20" width="70" height="70" stroke="#E8A33D" stroke-width="2" />
    </svg>

    <svg class="wave-divider" viewBox="0 0 90 800" preserveAspectRatio="none">
      <path
        d="M0,0 Q90,50 0,100 Q-90,150 0,200 Q90,250 0,300 Q-90,350 0,400
           Q90,450 0,500 Q-90,550 0,600 Q90,650 0,700 Q-90,750 0,800
           L90,800 L90,0 Z"
        fill="var(--k-ink)"
      />
    </svg>
  </section>

  <section class="auth-panel-right">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1><span class="accent">VARIEDADES JYB</span> · Iniciar sesión</h1>
      </div>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" type="email" [(ngModel)]="email" placeholder="correo@ejemplo.com" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" />
      </div>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button class="submit-btn" (click)="onLogin()" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Ingresar' }}
      </button>

      <p class="switch-link">¿No tienes cuenta? <a routerLink="/auth/registro">Regístrate</a></p>
    </div>
  </section>
</div>
