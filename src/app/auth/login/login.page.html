<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <img class="brand-mark" src="assets/icon/logo.png" alt="Home ALS" />
      <div>
        <h1>Inicia sesión</h1>
        <p>Pedidos, entregas y cuadres de Home ALS.</p>
      </div>
    </div>

    <p class="ok-msg" role="status" *ngIf="avisoOk">{{ avisoOk }}</p>

    <form class="auth-form" (ngSubmit)="onLogin()">
      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="username"
          inputmode="email"
          autocapitalize="off"
          spellcheck="false"
          [(ngModel)]="email"
          placeholder="nombre@correo.com"
          [attr.aria-invalid]="!!errorMsg"
        />
      </div>

      <div class="field">
        <div class="field-row">
          <label for="password">Contraseña</label>
          <a class="field-link" routerLink="/auth/recuperar">¿La olvidaste?</a>
        </div>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            [type]="verClave ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="password"
            (keydown)="revisarMayus($event)"
            (keyup)="revisarMayus($event)"
            (blur)="bloqMayus = false"
            [attr.aria-invalid]="!!errorMsg"
            aria-describedby="aviso-mayus"
          />
          <button
            type="button"
            class="reveal-btn"
            (click)="verClave = !verClave"
            [attr.aria-pressed]="verClave"
            [attr.aria-label]="verClave ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ verClave ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <p id="aviso-mayus" class="warn-msg" *ngIf="bloqMayus">Bloq Mayús está activado.</p>
      </div>

      <p class="error-msg" role="alert" *ngIf="errorMsg">
        {{ errorMsg }}
        <ng-container *ngIf="segundosBloqueo > 0"> Podrás intentar en <strong class="num">{{ textoBloqueo }}</strong>.</ng-container>
      </p>

      <button type="submit" class="submit-btn" [disabled]="loading || segundosBloqueo > 0">
        {{ loading ? 'Ingresando…' : segundosBloqueo > 0 ? 'Espera ' + textoBloqueo : 'Ingresar' }}
      </button>
    </form>

    <p class="switch-link">
      ¿Todavía no tienes cuenta? <a routerLink="/auth/registro">Crear cuenta</a>.
      Las cuentas nuevas entran como vendedor y el administrador asigna los demás roles.
    </p>
  </div>
</div>
