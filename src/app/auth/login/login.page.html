<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-head">
      <img class="brand-mark" src="assets/icon/logo.png" alt="Home ALS" />
      <div>
        <h1>Inicia sesión</h1>
        <p>Pedidos, entregas y cuadres de Home ALS.</p>
      </div>
    </div>

    <p class="ok-msg" role="status" *ngIf="recienRegistrado">Cuenta creada. Ya puedes iniciar sesión.</p>

    <form class="auth-form" (ngSubmit)="onLogin()">
      <div class="field">
        <label for="email">Correo</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          [(ngModel)]="email"
          placeholder="nombre@correo.com"
          [attr.aria-invalid]="!!errorMsg"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            [type]="verClave ? 'text' : 'password'"
            autocomplete="current-password"
            [(ngModel)]="password"
            [attr.aria-invalid]="!!errorMsg"
          />
          <button type="button" class="reveal-btn" (click)="verClave = !verClave">
            {{ verClave ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <p class="error-msg" role="alert" *ngIf="errorMsg">{{ errorMsg }}</p>

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? 'Ingresando…' : 'Ingresar' }}
      </button>
    </form>

    <p class="switch-link">
      ¿Todavía no tienes cuenta? <a routerLink="/auth/registro">Crear cuenta</a>.
      Las cuentas nuevas entran como vendedor y el administrador asigna los demás roles.
    </p>
  </div>
</div>
