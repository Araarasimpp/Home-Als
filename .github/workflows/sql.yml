# Ejecuta un archivo SQL de supabase/sql/ contra la base de datos de Home ALS.
# Solo lo pueden lanzar personas con permiso de escritura en el repositorio
# (GitHub → Actions → "SQL en Supabase" → Run workflow).
#
#   leer     ejecuta el archivo y muestra el resultado (solo para consultas de
#            estructura: el registro de Actions es público, nunca consultar datos
#            de clientes con este modo).
#   probar   ejecuta el archivo dentro de una transacción y la deshace al final
#            (rollback): sirve para comprobar que la migración no tiene errores.
#   aplicar  ejecuta el archivo en una sola transacción y la confirma.
#
# Usa el mismo secreto SUPABASE_DB_URL del respaldo semanal.

name: SQL en Supabase

on:
  workflow_dispatch:
    inputs:
      archivo:
        description: 'Ruta del archivo (ej. supabase/sql/2026-10-06_canal_local.sql)'
        required: true
        type: string
      modo:
        description: 'leer, probar o aplicar'
        required: true
        default: probar
        type: choice
        options: [leer, probar, aplicar]

permissions:
  contents: read

concurrency:
  group: sql-supabase
  cancel-in-progress: false

jobs:
  sql:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        # En modo leer se reparte el resultado en bloques (las anotaciones de
        # GitHub tienen límite de tamaño). En los otros modos solo corre el bloque 0.
        bloque: [0, 1, 2, 3, 4, 5]
    timeout-minutes: 10
    steps:
      - name: Saltar bloques extra
        id: salto
        run: |
          if [ "${{ inputs.modo }}" != "leer" ] && [ "${{ matrix.bloque }}" != "0" ]; then echo "saltar=1" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.salto.outputs.saltar != '1'

      - name: Revisar archivo
        if: steps.salto.outputs.saltar != '1'
        env:
          ARCHIVO: ${{ inputs.archivo }}
        run: |
          case "$ARCHIVO" in
            supabase/sql/*.sql) ;;
            *) echo "::error::El archivo debe estar en supabase/sql/ y terminar en .sql"; exit 1 ;;
          esac
          case "$ARCHIVO" in *..*) echo "::error::Ruta no válida"; exit 1 ;; esac
          test -f "$ARCHIVO" || { echo "::error::No existe $ARCHIVO"; exit 1; }

      - name: Instalar cliente de Postgres
        if: steps.salto.outputs.saltar != '1'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Ejecutar
        if: steps.salto.outputs.saltar != '1'
        env:
          DB_URL_CRUDA: ${{ secrets.SUPABASE_DB_URL }}
          ARCHIVO: ${{ inputs.archivo }}
          MODO: ${{ inputs.modo }}
        run: |
          DB_URL=$(python3 - <<'PY'
          import os, re, sys
          from urllib.parse import quote, unquote
          url = os.environ["DB_URL_CRUDA"].strip().strip('"').strip("'")
          m = re.match(r'^(postgres(?:ql)?://)([^:/@]+):(.*)@([^@]+)$', url, re.S)
          if not m:
              sys.exit("La URI no tiene la forma postgresql://usuario:clave@servidor:puerto/postgres")
          esquema, usuario, clave, resto = m.groups()
          clave = clave.strip()
          if clave.startswith('[') and clave.endswith(']'):
              clave = clave[1:-1]
          clave = quote(unquote(clave), safe='')
          print(f"{esquema}{usuario}:{clave}@{resto.strip()}")
          PY
          )
          echo "::add-mask::$DB_URL"
          export PGCONNECT_TIMEOUT=20
          set +e
          case "$MODO" in
            leer)
              psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off -f "$ARCHIVO" > /tmp/salida.txt 2>&1 ;;
            probar)
              { echo 'begin;'; cat "$ARCHIVO"; echo; echo 'rollback;'; } \
                | psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off > /tmp/salida.txt 2>&1 ;;
            aplicar)
              psql "$DB_URL" -X -v ON_ERROR_STOP=1 -P pager=off --single-transaction -f "$ARCHIVO" > /tmp/salida.txt 2>&1 ;;
          esac
          CODIGO=$?
          set -e
          # Por si alguna función guarda una llave: se ocultan JWT y cadenas largas tipo secreto.
          sed -E 's/eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*/[OCULTO]/g; s/(sk|pk|whsec|sb_secret|sb_publishable)_[A-Za-z0-9_-]{8,}/[OCULTO]/g; s/[A-Za-z0-9+\/_-]{40,}/[OCULTO]/g' \
            /tmp/salida.txt > /tmp/salida_limpia.txt
          rm -f /tmp/salida.txt
          cat /tmp/salida_limpia.txt
          if [ "$CODIGO" != "0" ]; then
            python3 -c "import sys; t=open('/tmp/salida_limpia.txt').read()[-6000:]; print('::error title=Falló ($MODO)::' + t.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit "$CODIGO"
          fi
          case "$MODO" in
            probar) echo "::notice title=Prueba sin errores::Nada quedó guardado (rollback)." ;;
            aplicar) echo "::notice title=Aplicado::Cambios confirmados." ;;
          esac

      - name: Resultado (paso 1)
        if: always() && steps.salto.outputs.saltar != '1'
        env:
          BLOQUE: ${{ matrix.bloque }}
        run: |
          python3 - <<'PY'
          import os
          t = open('/tmp/salida_limpia.txt', encoding='utf-8').read()
          tam = 3800
          partes = [t[i:i+tam] for i in range(0, len(t), tam)]
          ini = int(os.environ['BLOQUE']) * 50 + 0
          for n in range(ini, min(ini + 10, len(partes))):
              msg = partes[n].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::notice title=parte {n+1} de {len(partes)}::{msg}")
          PY
      - name: Resultado (paso 2)
        if: always() && steps.salto.outputs.saltar != '1'
        env:
          BLOQUE: ${{ matrix.bloque }}
        run: |
          python3 - <<'PY'
          import os
          t = open('/tmp/salida_limpia.txt', encoding='utf-8').read()
          tam = 3800
          partes = [t[i:i+tam] for i in range(0, len(t), tam)]
          ini = int(os.environ['BLOQUE']) * 50 + 10
          for n in range(ini, min(ini + 10, len(partes))):
              msg = partes[n].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::notice title=parte {n+1} de {len(partes)}::{msg}")
          PY
      - name: Resultado (paso 3)
        if: always() && steps.salto.outputs.saltar != '1'
        env:
          BLOQUE: ${{ matrix.bloque }}
        run: |
          python3 - <<'PY'
          import os
          t = open('/tmp/salida_limpia.txt', encoding='utf-8').read()
          tam = 3800
          partes = [t[i:i+tam] for i in range(0, len(t), tam)]
          ini = int(os.environ['BLOQUE']) * 50 + 20
          for n in range(ini, min(ini + 10, len(partes))):
              msg = partes[n].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::notice title=parte {n+1} de {len(partes)}::{msg}")
          PY
      - name: Resultado (paso 4)
        if: always() && steps.salto.outputs.saltar != '1'
        env:
          BLOQUE: ${{ matrix.bloque }}
        run: |
          python3 - <<'PY'
          import os
          t = open('/tmp/salida_limpia.txt', encoding='utf-8').read()
          tam = 3800
          partes = [t[i:i+tam] for i in range(0, len(t), tam)]
          ini = int(os.environ['BLOQUE']) * 50 + 30
          for n in range(ini, min(ini + 10, len(partes))):
              msg = partes[n].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::notice title=parte {n+1} de {len(partes)}::{msg}")
          PY
      - name: Resultado (paso 5)
        if: always() && steps.salto.outputs.saltar != '1'
        env:
          BLOQUE: ${{ matrix.bloque }}
        run: |
          python3 - <<'PY'
          import os
          t = open('/tmp/salida_limpia.txt', encoding='utf-8').read()
          tam = 3800
          partes = [t[i:i+tam] for i in range(0, len(t), tam)]
          ini = int(os.environ['BLOQUE']) * 50 + 40
          for n in range(ini, min(ini + 10, len(partes))):
              msg = partes[n].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::notice title=parte {n+1} de {len(partes)}::{msg}")
          PY
